services:
  postgres_dev:
    image: "postgres:16-alpine"
    container_name: plane_postgres_dev
    restart: unless-stopped
    env_file:
      - .env.dev
    volumes:
      - "postgres_dev_data:/var/lib/postgresql/data"
    networks:
      - dev-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-sdiuser_pro} -d ${DB_DATABASE:-project_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis_dev:
    image: "redis:7-alpine"
    container_name: plane_redis_dev
    restart: unless-stopped
    env_file:
      - .env.dev
    volumes:
      - "redis_dev_data:/data"
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs_dev:
    image: "rustfs/rustfs:latest"
    container_name: plane_rustfs_dev
    restart: unless-stopped
    env_file:
      - .env.dev
    volumes:
      - "rustfs_dev_data:/data"
    networks:
      - dev-network
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mailpit_dev:
    image: "axllent/mailpit:latest"
    container_name: plane_mailpit_dev
    restart: unless-stopped
    networks:
      - dev-network

  api_dev:
    build:
      context: ./apps/api
      dockerfile: ./deploy/dev/Dockerfile.dev
    container_name: plane_api_dev
    restart: unless-stopped
    env_file:
      - .env.dev
    networks:
      - dev-network
    depends_on:
      postgres_dev:
        condition: service_healthy
      redis_dev:
        condition: service_healthy
      rustfs_dev:
        condition: service_healthy

  web_dev:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-}"
        NEXT_PUBLIC_REPORT_API_URL: "${NEXT_PUBLIC_REPORT_API_URL:-}"
    container_name: plane_web_dev
    restart: unless-stopped
    env_file:
      - .env.dev
    networks:
      - dev-network
    depends_on:
      - api_dev

  gateway_dev:
    image: "nginx:alpine"
    container_name: plane_gateway_dev
    restart: unless-stopped
    ports:
      - "${DEV_GATEWAY_PORT:-80}:80"
    volumes:
      - ./deploy/gateway/dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dev-network
    depends_on:
      - api_dev
      - web_dev

networks:
  dev-network:
    driver: bridge
volumes:
  postgres_dev_data:
  redis_dev_data:
  rustfs_dev_data:
