name: CI Quality Gate

on:
  pull_request:
    branches: [ dev, main ]
  push:
    branches: [ dev ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # 1. Verificación de Formato y Estilo de Código (Pint)
  # -------------------------------------------------------------
  code-style:
    name: Code Style (Pint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Pint Check
        run: ./vendor/bin/pint --test

  # -------------------------------------------------------------
  # 2. Suite Completa de Pruebas Automatizadas (Pest)
  # -------------------------------------------------------------
  tests:
    name: Pest Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, redis, bcmath, pcntl, gd, mbstring, xml, ctype, curl, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Pest Test Suite
        run: ./vendor/bin/pest

  # -------------------------------------------------------------
  # 4. Información del Ambiente de Preview (Dokploy)
  # -------------------------------------------------------------
  preview-deployment-info:
    name: Preview Deployment Info
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [code-style, tests]
    permissions:
      contents: read
      pull-requests: write
      issues: write
      deployments: read
    steps:
      - name: Output Preview URL to Step Summary
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          APP_NAME="sdi-service-template"
          PREVIEW_URL="https://preview-${APP_NAME}-${PR_NUM}.ganebyd.com"
          echo "### 🚀 Preview Deployment Activo" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "El backend aislado para este Pull Request se despliega en Dokploy:" >> $GITHUB_STEP_SUMMARY
          echo "🔗 **Enlace Referencial:** [$PREVIEW_URL]($PREVIEW_URL)" >> $GITHUB_STEP_SUMMARY
          echo "📌 *Nota: Dokploy genera un subdominio único (\`preview-${APP_NAME}-<hash>.ganebyd.com\`) visible en la sección Deployments del PR y en el panel de Dokploy.*" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Base de Datos:** Aislada (\`sdi_db_preview\`, esquema: \`template\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Sincronización:** Automática en cada push (\`pull_request: synchronize\`)." >> $GITHUB_STEP_SUMMARY
          echo "- **Destrucción:** Automática al fusionar o cerrar este PR." >> $GITHUB_STEP_SUMMARY

      - name: Post Comment on PR
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = context.payload.pull_request.number;
            const appName = "sdi-service-template";
            let previewUrl = `https://preview-${appName}-${prNum}.ganebyd.com`;

            try {
              const deployments = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.payload.pull_request.head.ref,
              });
              if (deployments.data && deployments.data.length > 0) {
                const statuses = await github.rest.repos.listDeploymentStatuses({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployments.data[0].id,
                });
                const envUrl = statuses.data.find(s => s.environment_url)?.environment_url;
                if (envUrl) {
                  previewUrl = envUrl;
                }
              }
            } catch (err) {
              // fallback
            }

            const commentBody = `### 🚀 Preview Deployment Activo\n\nEl backend para este Pull Request está disponible para integración en:\n🔗 **[${previewUrl}](${previewUrl})**\n\n> 💡 *Si Dokploy utiliza un subdominio con hash único, consulta el enlace exacto en la pestaña **Deployments / Environments** de esta PR o en el panel de Dokploy.*\n\n- **Base de Datos:** Aislada (\`sdi_db_preview\`, esquema: \`template\`)\n- **Sincronización:** Automática en cada push (\`action: synchronize\`).\n- **Destrucción:** Automática al cerrar o fusionar el PR.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNum,
              body: commentBody
            });
