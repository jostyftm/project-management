services:
  postgres_prod:
    image: "postgres:16-alpine"
    container_name: plane_postgres_prod
    restart: always
    env_file:
      - .env.prod
    volumes:
      - "postgres_prod_data:/var/lib/postgresql/data"
    networks:
      - plane_clone-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-sdiuser_pro} -d ${DB_DATABASE:-project_prod}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis_prod:
    image: "redis:7-alpine"
    container_name: plane_redis_prod
    restart: always
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-secret_password}",
      ]
    env_file:
      - .env.prod
    volumes:
      - "redis_prod_data:/data"
    networks:
      - plane_clone-network
    healthcheck:
      test:
        ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs_prod:
    image: "rustfs/rustfs:latest"
    container_name: plane_rustfs_prod
    restart: always
    env_file:
      - .env.prod
    volumes:
      - "rustfs_prod_data:/data"
    networks:
      - plane_clone-network
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api_prod:
    build:
      context: ./apps/api
      dockerfile: ./deploy/prod/Dockerfile.prod
    container_name: plane_api_prod
    restart: always
    env_file:
      - .env.prod
    networks:
      - plane_clone-network
    depends_on:
      postgres_prod:
        condition: service_healthy
      redis_prod:
        condition: service_healthy
      rustfs_prod:
        condition: service_healthy

  web_prod:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: "${PROD_APP_URL:-http://localhost:8002}"
        NEXT_PUBLIC_REPORT_API_URL: "${PROD_APP_URL:-http://localhost:8002}"
    container_name: plane_web_prod
    restart: always
    env_file:
      - .env.prod
    networks:
      - plane_clone-network
    depends_on:
      - api_prod

  gateway_prod:
    image: "nginx:alpine"
    container_name: plane_gateway_prod
    restart: always
    ports:
      - "${PROD_GATEWAY_PORT:-80}:80"
      - "${PROD_APP_PORT:-8002}:8002"
      - "${PROD_WEB_PORT:-3002}:3002"
    volumes:
      - ./deploy/gateway/prod/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - plane_clone-network
    depends_on:
      - api_prod
      - web_prod

networks:
  plane_clone-network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  rustfs_prod_data:
