services:
  postgres:
    image: postgres:16-alpine
    container_name: plane_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: plane_db
      POSTGRES_USER: plane_user
      POSTGRES_PASSWORD: plane_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plane_user -d plane_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: plane_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: plane_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "Plane Clone API"
      APP_ENV: local
      APP_KEY: "base64:3f05b1c8f1064841ab7cfd2a806930da03260c67980838118021c5658607185c"
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: plane_db
      DB_USERNAME: plane_user
      DB_PASSWORD: plane_secret
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: plane_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      NEXT_PUBLIC_LOGIN_ROUTE: "/login"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
